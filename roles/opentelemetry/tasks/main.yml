---
- name: Add OpenTelemetry Helm repository
  ansible.builtin.shell: |
    helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
    helm repo update
  changed_when: false

- name: Install OpenTelemetry Demo
  ansible.builtin.command: >
    helm upgrade --install my-otel-demo open-telemetry/opentelemetry-demo
    --namespace default
    --set grafana.resources.limits.memory=512Mi
    --set grafana.resources.requests.memory=256Mi
    --set grafana.shadowBundledPlugins=true
    --set prometheus.server.persistentVolume.enabled=false
    --set prometheus.alertmanager.persistentVolume.enabled=false
    --wait
  changed_when: false

- name: Expose OpenTelemetry frontend via LoadBalancer
  ansible.builtin.shell: |
    kubectl patch svc my-otel-demo-frontendproxy -p '{"spec":{"type":"LoadBalancer"}}'
  changed_when: false
