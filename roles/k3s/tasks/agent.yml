---
- name: Install K3s agent
  shell: |
    curl -sfL https://get.k3s.io | \
    INSTALL_K3S_EXEC="agent \
    --server https://{{ k3s_server_ip }}:6443 \
    --token {{ k3s_token }} \
    --node-ip {{ ansible_host }} \
    --flannel-iface eth1" \
    sh -s -

- name: Ensure K3s agent service is running
  service:
    name: k3s-agent
    state: started
    enabled: yes
