---
- name: Wait until all nodes have joined
  ansible.builtin.command: kubectl get nodes --no-headers
  register: nodes
  retries: 20
  delay: 5
  until: nodes.stdout_lines | length == 5
  changed_when: false

- name: Taint control plane
  ansible.builtin.command: >
    kubectl taint nodes {{ inventory_hostname }}
    node-role.kubernetes.io/control-plane=true:NoSchedule --overwrite
  changed_when: false

- name: Copy kubeconfig for vagrant user
  ansible.builtin.copy:
    remote_src: true
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/vagrant/k3s.yaml
    owner: vagrant
    group: vagrant
    mode: "0644"

- name: Ensure local .kube directory exists
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: "0755"

- name: Fetch kubeconfig to localhost
  ansible.builtin.fetch:
    src: /home/vagrant/k3s.yaml
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: true

- name: Update kubeconfig server address
  delegate_to: localhost
  become: false
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    regexp: '127\.0\.0\.1'
    replace: "{{ k3s_server_ip }}"

- name: Verify cluster nodes
  ansible.builtin.command: kubectl get nodes -o wide
  register: cluster_nodes
  changed_when: false

- name: Display cluster nodes
  ansible.builtin.debug:
    var: cluster_nodes.stdout_lines
