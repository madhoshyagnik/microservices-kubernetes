---
- name: Verify host-local prerequisites (kubectl, helm, kubeconfig, cluster-connectivity)
  ansible.builtin.import_tasks: preflight.yaml

- name: Deploy MetalLB using Helm and validate rollout
  ansible.builtin.import_tasks: install.yaml

- name: Set the IP range for MetalLB
  ansible.builtin.import_tasks: configure.yaml